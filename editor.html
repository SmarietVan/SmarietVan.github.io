<!DOCTYPE html>
<html lang="zh-CN" data-theme="starry">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="only light">
    <title>写日志 - SmarietVan的空间</title>
    <link rel="stylesheet" href="assets/css/qqzone.css?v=11">
</head>
<body data-page="editor">

<header class="topbar">
    <div class="topbar-inner">
        <a class="logo" href="index.html"><span class="logo-star">★</span> SmarietVan的空间</a>
        <nav class="topnav">
            <a href="index.html" class="topnav-item">我的主页</a>
            <a href="blog.html" class="topnav-item active">日志</a>
            <a href="album.html" class="topnav-item">相册</a>
            <a href="guestbook.html" class="topnav-item">留言板</a>
            <div class="topnav-item dress" id="dressBtn">装扮 ▾
                <div class="skin-panel hidden" id="skinPanel">
                    <button data-skin="starry" class="skin-option">星空蓝</button>
                    <button data-skin="pink" class="skin-option">樱花粉</button>
                    <button data-skin="cool" class="skin-option">炫酷黑</button>
                    <button data-skin="green" class="skin-option">清新绿</button>
                </div>
            </div>
        </nav>
        <div class="topbar-right">
            <div class="music" id="musicPlayer" title="背景音乐">
                <button class="music-play" id="playBtn">▶</button>
                <span class="eq" id="eq"><i></i><i></i><i></i><i></i></span>
                <span class="music-name" id="musicName">背景音乐</span>
                <audio id="bgm" loop></audio>
            </div>
            <img class="topbar-avatar" src="https://github.com/SmarietVan.png" alt="avatar">
            <span class="topbar-nick">SmarietVan</span>
            <span class="diamond" title="黄钻贵族">💎</span>
        </div>
    </div>
</header>

<div class="container subpage editor-page">
    <section class="card">
        <div class="page-tabs">
            <span class="ptab active" id="editorTitle">写日志</span>
            <div class="ptools"><span><a href="blog.html" style="color:inherit">« 返回日志列表</a></span></div>
        </div>
        <div class="editor-body">
            <div class="login-bar" id="loginBar"></div>
            <div id="editorForm" class="owner-only">
            <input type="text" class="ed-title" id="edTitle" placeholder="请输入日志标题" maxlength="60">
            <div class="ed-row">
                <label>分类：</label>
                <select id="edCate" class="ed-select"></select>
                <button class="btn-plain" id="edNewCate">＋ 新建分类</button>
                <label class="ed-priv"><input type="checkbox" id="edPriv"> 私密日记（仅自己可见）</label>
            </div>
            <div class="ed-toolbar">
                <button class="btn-plain" id="edImage">🖼 插入图片</button>
                <button class="btn-plain" id="edPreviewBtn">👁 预览</button>
                <span class="ed-tip">支持 Markdown，可直接粘贴 .md 文本</span>
            </div>
            <textarea class="ed-content" id="edContent" placeholder="正文：支持 Markdown 格式……&#10;# 标题、**加粗**、- 列表、`代码`、![图片](链接) 都可以"></textarea>
            <div class="ed-preview md-body hidden" id="previewArea"></div>
            <div class="ed-actions">
                <button class="btn-blue" id="edPublish">发 表</button>
                <button class="btn-plain" id="edDraft">存草稿</button>
                <button class="btn-plain" id="edCancel">取 消</button>
            </div>
            </div>
        </div>
    </section>
</div>

<footer class="footer">© 2025 SmarietVan的空间 · Powered by GitHub Pages</footer>

<script src="assets/js/marked.min.js"></script>
<script src="assets/js/store.js?v=11"></script>
<script src="assets/js/qqzone.js?v=11"></script>
<script src="assets/js/app.js?v=11"></script>
</body>
</html>
