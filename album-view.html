<!DOCTYPE html>
<html lang="zh-CN" data-theme="starry">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="only light">
    <title>相册详情 - SmarietVan的空间</title>
    <link rel="stylesheet" href="assets/css/qqzone.css?v=17">
</head>
<body data-page="album-view">

<header class="topbar">
    <div class="topbar-inner">
        <a class="logo" href="index.html"><span class="logo-star">★</span> SmarietVan的空间</a>
        <nav class="topnav">
            <a href="index.html" class="topnav-item">我的主页</a>
            <a href="blog.html" class="topnav-item">日志</a>
            <a href="album.html" class="topnav-item active">相册</a>
            <div class="topnav-item dress" id="dressBtn">装扮 ▾
                <div class="skin-panel hidden" id="skinPanel">
                    <button data-skin="starry" class="skin-option">星空蓝</button>
                    <button data-skin="pink" class="skin-option">樱花粉</button>
                    <button data-skin="cool" class="skin-option">炫酷黑</button>
                    <button data-skin="green" class="skin-option">清新绿</button>
                </div>
            </div>
        </nav>
        <div class="topbar-right">
            <div class="music" id="musicPlayer" title="背景音乐">
                <button class="music-play" id="playBtn">▶</button>
                <span class="eq" id="eq"><i></i><i></i><i></i><i></i></span>
                <span class="music-name" id="musicName">背景音乐</span>
                <audio id="bgm" loop></audio>
            </div>
            <img class="topbar-avatar" src="https://github.com/SmarietVan.png" alt="avatar">
            <span class="topbar-nick">SmarietVan</span>
            <span class="diamond" title="黄钻贵族">💎</span>
        </div>
    </div>
</header>

<div class="container subpage">
    <section class="card">
        <div class="page-tabs">
            <span class="ptab active" id="albumName">相册</span>
            <div class="ptools"><span><a href="album.html" style="color:inherit">« 返回相册列表</a></span></div>
        </div>
        <div class="page-main">
            <div class="btn-row owner-only">
                <button class="btn-blue" id="uploadPhotoBtn">＋ 上传照片</button>
                <button class="btn-plain" id="renameAlbumBtn">重命名</button>
                <button class="btn-plain btn-danger" id="deleteAlbumBtn">删除相册</button>
            </div>
            <div class="photo-grid" id="photoGrid"></div>
        </div>
    </section>
</div>

<!-- 灯箱 -->
<div class="lightbox hidden" id="lightbox">
    <button class="lb-close" id="lbClose">✕</button>
    <img id="lbImg" alt="">
    <div class="lb-bar">
        <span id="lbName"></span>
        <button class="btn-plain btn-danger" id="lbDelete">删除这张照片</button>
    </div>
</div>

<footer class="footer">© 2025 SmarietVan的空间 · Powered by GitHub Pages</footer>

<input type="file" id="filePicker" accept="image/*" multiple hidden>
<script src="assets/js/store.js?v=17"></script>
<script src="assets/js/qqzone.js?v=17"></script>
<script src="assets/js/app.js?v=17"></script>
</body>
</html>
