<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {% seo %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cinzel+Decorative:wght@700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
</head>
<body>
  <div class="page-frame">
    <header class="site-header">
      <div class="header-ornament">&#10087; &#10087; &#10087;</div>
      <h1 class="site-title"><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
      <p class="site-subtitle">{{ site.description }}</p>
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}">&#9876; 营地</a>
        <a href="{{ '/feed.xml' | relative_url }}">&#128220; 卷轴订阅</a>
      </nav>
    </header>

    <main class="site-main">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="footer-ornament">&#8226; &#10087; &#8226;</div>
      <p>&copy; {{ site.time | date: '%Y' }} SmarietVan &middot; 由 Jekyll 与 GitHub Pages 铸造</p>
    </footer>
  </div>
</body>
</html>
